  <desc
     id="desc1">Two winding dot-segments forming the line seen by people with red-green colour deficiency on plate 34. The left segment (red-green coloured dots) runs from the left X to the centre meeting point. The right segment (violet/purple dots) runs from the centre to the right X.</desc>
